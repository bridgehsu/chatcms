<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0;url=https://chatcms.org/" />
    <title>ChatCMS Docs</title>
    <script>
      (function () {
        var dest = "https://chatcms.org/";
        if (location.hostname === "bridgehsu.github.io") {
          var rest = location.pathname.replace(/^\/chatcms\/?/, "/") || "/";
          dest = "https://chatcms.org" + rest + location.search + location.hash;
        }
        location.replace(dest);
      })();
    </script>
  </head>
  <body>
    <p>文档站已迁移至 <a href="https://chatcms.org/">https://chatcms.org/</a></p>
  </body>
</html>
